<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
<defs><filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
  <feGaussianBlur stdDeviation="10" result="b"/>
  <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter></defs>
<g transform="translate(0,0) scale(1.0)">
  <rect x="16" y="16" width="480" height="480" rx="104" fill="none" stroke="none"/>
  <!-- stat bars -->
  <g filter="url(#glow)">
    <rect x="104" y="304" width="64" height="112" rx="14" fill="#8FFF2E" opacity="0.38"/>
    <rect x="200" y="248" width="64" height="168" rx="14" fill="#8FFF2E" opacity="0.66"/>
    <rect x="296" y="176" width="64" height="240" rx="14" fill="#8FFF2E"/>
  </g>
  <!-- shot trajectory -->
  <path d="M 136 268 Q 250 118 372 118" fill="none" stroke="#5BD417" stroke-width="11"
        stroke-linecap="round" stroke-dasharray="2 30"/>
  <!-- ball -->
  <g filter="url(#glow)">
    <circle cx="396" cy="112" r="42" fill="#0B1120" stroke="#8FFF2E" stroke-width="11"/>
    <path d="M 396 82 L 422 100 L 412 130 L 380 130 L 370 100 Z" fill="none"
